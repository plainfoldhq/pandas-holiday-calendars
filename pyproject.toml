[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pandas-holiday-calendars"
version = "0.1.0"
description = "pandas holiday calendars with embedded, cross-checked dates: NYSE, Federal Reserve, US federal, England and Wales, Euro T2. Works with CustomBusinessDay, bdate_range and numpy.busday_count."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = ["pandas>=1.5"]
authors = [{ name = "Plainfold", email = "plainfoldhq@proton.me" }]
keywords = ["pandas", "holidays", "business days", "CustomBusinessDay", "NYSE", "federal reserve", "TARGET2", "bank holidays", "calendar", "finance"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Intended Audience :: Developers",
  "Intended Audience :: Financial and Insurance Industry",
  "Topic :: Office/Business :: Financial",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/plainfoldhq/pandas-holiday-calendars"
Documentation = "https://plainfoldhq.github.io/business-days/"
Source = "https://github.com/plainfoldhq/pandas-holiday-calendars"
Issues = "https://github.com/plainfoldhq/pandas-holiday-calendars/issues"

[tool.setuptools.package-data]
pandas_holiday_calendars = ["py.typed"]
